# ===================================================
# RENDER BLUEPRINT SPECIFICATION (render.yaml)
# Chiro UI License Center & PostgreSQL Service
# ===================================================

databases:
  - name: chiro-license-db
    databaseName: chiro_licenses
    user: chiro_user
    plan: free
    region: oregon
    ipAllowList: [] # Only internal Render connections

services:
  - type: web
    name: chiro-license-center
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm --prefix client install --include=dev && npm run build && npx prisma db push && npm run prisma:seed
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: chiro-license-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_EMAIL
        value: admin@chiro.local
      - key: INITIAL_ADMIN_PASSWORD
        value: ChangeThisSecurePassword2026!
